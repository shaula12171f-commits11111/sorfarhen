<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorfarhen - Estudio Japonés</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Sorfarhen</h1>
    <p>Sistema de estudio de japonés con flashcards</p>
  </header>

  <main id="main-content">
    <!-- Pantalla principal -->
    <section id="home-screen" class="screen active">
      <div class="container-block">
        <h2>Historias cortas</h2>
        <div class="subcontainers">
          <div class="subcontainer" data-gallery="1.1" data-name="itsuki playera putona">
            <div class="subcontainer-preview">
              <span class="sub-title">1.1 itsuki playera putona</span>
              <span class="sub-count">2 imágenes</span>
            </div>
          </div>
          <div class="subcontainer" data-gallery="1.2" data-name="Próximamente">
            <div class="subcontainer-preview disabled">
              <span class="sub-title">1.2 Próximamente</span>
            </div>
          </div>
          <div class="subcontainer" data-gallery="1.3" data-name="Próximamente">
            <div class="subcontainer-preview disabled">
              <span class="sub-title">1.3 Próximamente</span>
            </div>
          </div>
          <div class="subcontainer" data-gallery="1.4" data-name="Próximamente">
            <div class="subcontainer-preview disabled">
              <span class="sub-title">1.4 Próximamente</span>
            </div>
          </div>
          <div class="subcontainer" data-gallery="1.5" data-name="Próximamente">
            <div class="subcontainer-preview disabled">
              <span class="sub-title">1.5 Próximamente</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Modal de elección -->
    <div id="choice-modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="choice-title">¿Qué quieres hacer?</h3>
        <div class="choice-buttons">
          <button id="btn-ver-hentai" class="btn btn-primary">Ver hentai</button>
          <button id="btn-ver-flashcards" class="btn btn-secondary">Ver flashcards</button>
        </div>
        <button id="btn-close-choice" class="btn-close">×</button>
      </div>
    </div>

    <!-- Pantalla de galería / slideshow -->
    <section id="gallery-screen" class="screen">
      <div class="gallery-header">
        <button id="btn-back-gallery" class="btn-back">← Volver</button>
        <h2 id="gallery-title"></h2>
      </div>
      <div class="slideshow-container">
        <img id="slideshow-img" src="" alt="Imagen de la galería">
        <div class="slideshow-controls">
          <button id="btn-prev-img" class="btn">◀</button>
          <span id="img-counter">1 / 1</span>
          <button id="btn-next-img" class="btn">▶</button>
        </div>
      </div>
    </section>

    <!-- Pantalla de flashcards -->
    <section id="flashcards-screen" class="screen">
      <div class="flashcards-header">
        <button id="btn-back-flash" class="btn-back">← Volver</button>
        <h2 id="flash-title"></h2>
      </div>
      <div id="blocks-container" class="blocks-container"></div>
      <div id="quiz-area" class="quiz-area hidden">
        <div class="quiz-header">
          <button id="btn-back-to-blocks" class="btn-back-small">← Bloques</button>
          <span id="quiz-progress"></span>
        </div>
        <div class="quiz-card">
          <h2 id="quiz-word" class="quiz-word"></h2>
          <div id="romaji-display" class="romaji-display hidden"></div>
          <div id="options-container" class="options-container"></div>
          <button id="btn-next-card" class="btn btn-next hidden">Siguiente</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
